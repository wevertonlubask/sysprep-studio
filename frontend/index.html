<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Monte o sysprep.xml e o pacote de preparo da imagem padrão Windows em Modo Auditoria." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2b2b2b" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sysprep Studio" />
    <meta name="application-name" content="Sysprep Studio" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icones/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Sysprep Studio</title>
    <script>
      // aplica o tema antes da primeira pintura; mesma regra de src/tema.ts
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("sysprep.tema");
        } catch (e) {}
        if (t !== "claro" && t !== "escuro")
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
        document.documentElement.dataset.tema = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
